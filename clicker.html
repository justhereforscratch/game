<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noob Clicker Game</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #ade1f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      user-select: none;
      text-align: center;
    }
    h1 {
      color: #1e90ff;
      margin-bottom: 5px;
    }
    #score {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    #noob-img {
      width: 220px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    #noob-img:active {
      transform: scale(0.95);
    }
    #instructions {
      margin-top: 15px;
      color: #555;
      font-style: italic;
      margin-bottom: 20px;
    }
    #install-btn {
      background: #1e90ff;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgb(30 144 255 / 0.5);
      transition: background-color 0.3s ease;
      user-select: none;
    }
    #install-btn:hover {
      background: #1473d2;
    }
    #install-btn:active {
      background: #0f4a7a;
    }
    #install-btn.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Roblox Noob 2006 Clicker</h1>
  <div id="score">Clicks: 0</div>
  <img
    id="noob-img"
    src="https://static.wikia.nocookie.net/roblox/images/3/3b/NOOB%21.png/revision/latest?cb=20210630174226"
    alt="Roblox Noob 2006"
  />
  <div id="instructions">Click the Noob to earn points!</div>

  <button id="install-btn" class="hidden">Install to PC</button>

<script>
  // Clicker game logic
  const scoreDisplay = document.getElementById('score');
  const noobImg = document.getElementById('noob-img');
  let clicks = 0;

  noobImg.addEventListener('click', () => {
    clicks++;
    scoreDisplay.textContent = `Clicks: ${clicks}`;
    noobImg.style.transform = 'scale(1.1)';
    setTimeout(() => {
      noobImg.style.transform = 'scale(1)';
    }, 100);
  });

  // PWA manifest info
  const manifest = {
    name: "Noob Clicker Game",
    short_name: "Clicker",
    start_url: ".",
    display: "standalone",
    background_color: "#ade1f9",
    theme_color: "#1e90ff",
    description: "A simple Roblox Noob clicker game",
    icons: [
      {
        src: "https://static.wikia.nocookie.net/roblox/images/3/3b/NOOB%21.png/revision/latest?cb=20210630174226",
        sizes: "192x192",
        type: "image/png"
      }
    ]
  };

  // Create manifest link tag dynamically
  const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(manifestBlob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  // Register service worker inline
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', event => {
        event.waitUntil(
          caches.open('noob-clicker-cache').then(cache => {
            return cache.addAll([
              './',
              './index.html',
              'https://static.wikia.nocookie.net/roblox/images/3/3b/NOOB%21.png/revision/latest?cb=20210630174226'
            ]);
          })
        );
      });

      self.addEventListener('fetch', event => {
        event.respondWith(
          caches.match(event.request).then(response => {
            return response || fetch(event.request);
          })
        );
      });
    `;

    const swBlob = new Blob([swCode], {type: 'application/javascript'});
    const swUrl = URL.createObjectURL(swBlob);

    navigator.serviceWorker.register(swUrl).catch(error => {
      console.log('Service worker registration failed:', error);
    });
  }

  // Handle the install prompt and button
  let deferredPrompt;
  const installBtn = document.getElementById('install-btn');

  window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent Chrome from showing the default prompt
    e.preventDefault();
    deferredPrompt = e;
    // Show the custom install button
    installBtn.classList.remove('hidden');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const choiceResult = await deferredPrompt.userChoice;
    if (choiceResult.outcome === 'accepted') {
      console.log('User accepted the install prompt');
    } else {
      console.log('User dismissed the install prompt');
    }
    deferredPrompt = null;
    installBtn.classList.add('hidden');
  });

  // Optional: Hide the button if already installed
  window.addEventListener('appinstalled', () => {
    installBtn.classList.add('hidden');
    console.log('App installed!');
  });
</script>

</body>
</html>
